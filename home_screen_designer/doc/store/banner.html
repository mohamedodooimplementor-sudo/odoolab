<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=block" rel="stylesheet">
<!-- Source of static/description/banner.png (Store thumbnail). Render with headless Edge: --window-size=1000,1208 --force-device-scale-factor=1.2 --screenshot, after replacing ODOO_VERSION (19/20) and each CHK by a white check SVG (<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>). -->
<style>
  /* One image, two crops on the Store: the theme card shows it whole (portrait),
     the module page shows only the centered 2:1 band (y 354 to 854). That band is a complete banner. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1000px; height: 1208px; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", sans-serif; color: #17181c; position: relative;
    background:
      radial-gradient(560px 420px at 100% 40%, rgba(109, 94, 247, .20), transparent 70%),
      radial-gradient(460px 360px at 0% 62%, rgba(13, 148, 136, .14), transparent 70%),
      #f7f6ff; }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(67, 56, 202, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(67, 56, 202, .05) 1px, transparent 1px);
    background-size: 40px 40px; }
  /* A: header ribbon (cropped out on the module page) */
  .a { position: absolute; left: 56px; right: 56px; top: 82px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px;
    background: #fff; border: 1.5px solid #dcd8fb; font-size: 15px; font-weight: 700; letter-spacing: .14em; color: #4338ca; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: #0d9488; box-shadow: 0 0 0 4px rgba(13,148,136,.15); }
  .feats { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 30px; }
  .f { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 600; color: #26283a; }
  .f s { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, #6d5ef7, #4338ca); }
  .f:nth-child(4n+2) s, .f:nth-child(4n+3) s { background: linear-gradient(135deg, #2dd4bf, #0d9488); }
  .f s svg { width: 15px; height: 15px; }
  /* B: the 2:1 band, y 354 to 854 */
  .b { position: absolute; left: 0; top: 354px; width: 1000px; height: 500px; }
  .b .t { position: absolute; left: 56px; top: 62px; width: 440px; }
  h1 { font-size: 88px; line-height: .96; font-weight: 900; letter-spacing: -.045em; }
  h1 span { background: linear-gradient(90deg, #5b3fe0 0%, #4338ca 35%, #0d9488 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin-top: 22px; font-size: 25px; line-height: 1.35; font-weight: 500; color: #4b4d63; }
  .tag b { color: #17181c; font-weight: 700; }
  .ed { margin-top: 24px; display: flex; gap: 10px; }
  .ed span { padding: 7px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; background: #fff; border: 1.5px solid #e3e1f5; color: #3d4052; }
  .hero { position: absolute; left: 470px; top: 56px; width: 600px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(46, 42, 143, .30), 0 0 0 1px rgba(67,56,202,.10);
    transform: perspective(1800px) rotateY(-10deg) rotateX(2deg); transform-origin: left center; }
  .hero img { display: block; width: 100%; }
  /* C: screenshots stage (cropped out on the module page) */
  .stage { position: absolute; left: 34px; right: 34px; top: 880px; bottom: 34px; border-radius: 30px; overflow: hidden;
    background:
      radial-gradient(420px 300px at 15% 0%, rgba(139, 92, 246, .75), transparent 70%),
      radial-gradient(460px 320px at 95% 20%, rgba(16, 185, 129, .55), transparent 70%),
      linear-gradient(135deg, #2a1f7a, #1b1f4a 60%, #0f3b4a); }
  .shot { position: absolute; top: 34px; width: 438px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 20px 44px rgba(5, 4, 30, .55), 0 0 0 1px rgba(255,255,255,.12); }
  .shot img { display: block; width: 100%; }
  .s1 { left: 22px; } .s2 { right: 22px; }
  .badge { position: absolute; top: 14px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 999px;
    font-size: 14px; font-weight: 700; color: #fff; background: rgba(18, 16, 48, .78); border: 1px solid rgba(255,255,255,.18); }
  .badge i { width: 8px; height: 8px; border-radius: 50%; }
</style></head>
<body>
<div class="grid"></div>
<div class="a">
  <div class="pill"><i></i>ODOO ODOO_VERSION &nbsp;&middot;&nbsp; BACKEND THEME</div>
  <div class="feats">
    <div class="f"><s>CHK</s>Custom home screen</div>
    <div class="f"><s>CHK</s>Dark mode</div>
    <div class="f"><s>CHK</s>Apps sidebar</div>
    <div class="f"><s>CHK</s>Theme colors</div>
    <div class="f"><s>CHK</s>Drag &amp; drop app order</div>
    <div class="f"><s>CHK</s>Auto refresh of views</div>
    <div class="f"><s>CHK</s>User &amp; company layouts</div>
    <div class="f"><s>CHK</s>Custom PWA app icon</div>
  </div>
</div>
<div class="b">
  <div class="t">
    <h1>Home<br>Screen<br><span>Designer</span></h1>
    <p class="tag">Make Odoo feel like <b>your</b> app.</p>
    <div class="ed"><span>Community</span><span>Enterprise</span></div>
  </div>
  <div class="hero"><img src="../../static/description/hero.png"></div>
</div>
<div class="stage">
  <div class="badge" style="left: 36px;"><i style="background:#a78bfa"></i>Dark mode</div>
  <div class="badge" style="right: 36px;"><i style="background:#34d399"></i>Apps sidebar</div>
  <div class="shot s1"><img src="../../static/description/dark_list.png"></div>
  <div class="shot s2"><img src="../../static/description/appsbar.png"></div>
</div>
</body></html>
